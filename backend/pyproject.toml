[project]
name = "esci-product-search"
version = "0.1.0"
description = "Evaluated product search using Amazon ESCI"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pgvector>=0.3,<1",
]

[project.optional-dependencies]
data = ["pandas>=2.2,<3", "pyarrow>=18,<24"]
research = ["pandas>=2.2,<3", "pyarrow>=18,<24", "sentence-transformers>=3,<6", "ir-measures>=0.3,<1"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
